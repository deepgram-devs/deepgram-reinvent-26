# fly.toml app configuration file generated for dg-tri-county-claims on 2026-11-13T13:27:43-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dg-tri-county-claims'
primary_region = 'iad'

[build]
[env]
  AWS_REGION = 'us-east-1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
